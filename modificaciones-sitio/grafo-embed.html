<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style type="text/css">
  /* =========================================================
     CONTENEDOR: ocupa TODA la ventana (pantalla completa).
     position:fixed lo saca del layout del tema y tapa su header/footer.
     ========================================================= */
  #mampa-grafo {
    --bg:           #f4f4f4;
    --bg-warm:      #f8f8f8;
    --surface:      #ffffff;
    --surface2:     #eeeeee;
    --border:       #cccccc;
    --border-light: #e0e0e0;
    --text:         #1a1a1a;
    --text-dim:     #666666;
    --text-light:   #999999;
    --accent:       #00b2e3;
    --accent-dark:  #0080b1;
    --item:         #0080b1;
    --creator:      #00b2e3;
    --subject:      #87c6a1;
    --coverage:     #0080b1;
    --type:         #b7d181;
    --edge-color:   #8a9e78;
    --nav-h:        100px;

    /* Sin position:fixed ni reglas globales: el bloque ocupa el alto de la ventana
       dentro del flujo de la página, así no se "escapa" del editor de Omeka S. */
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    min-height: 600px;
    isolation: isolate;
    overflow: hidden;
    visibility: hidden;   /* nace oculto; el JS lo revela ya posicionado (evita el parpadeo) */
    animation: mh-reveal 0s linear .8s forwards;
    font-family: 'Raleway', sans-serif;
    background: var(--bg);
    color: var(--text);
    box-sizing: border-box;
  }
  #mampa-grafo *, #mampa-grafo *::before, #mampa-grafo *::after { box-sizing: border-box; }

  /* Seguro CSS: si el JS no revelara el bloque, se muestra solo a los 0.8s */
  @keyframes mh-reveal { to { visibility: visible; } }

  /* =========================================================
     HEADER / NAV BAR: réplica del header del tema freedomISEP
     (valores tomados de style.css del tema)
     ========================================================= */
  #mampa-grafo { --primary: #155180; }   /* color primario real del sitio (var(--primary)) */

  #mampa-grafo .main-header {
    position: absolute; top: 0; left: 0; width: 100%; z-index: 300;
    background: #fff;
    box-shadow: 0px 4px 6px 2px rgba(0,0,0,.11);
    font-family: 'Raleway', system-ui, sans-serif; font-size: 1rem; line-height: 1.5; color: #666;
  }
  #mampa-grafo .mh-container {
    width: 100%; max-width: 1440px; margin: 0 auto; padding: 0 15px;
  }
  @media (min-width: 768px) { #mampa-grafo .mh-container { padding: 0 30px; } }

  #mampa-grafo .mh-main-bar { display: flex; justify-content: space-between; align-items: center; }
  #mampa-grafo .mh-site-title { flex-shrink: 0; max-width: 50%; }
  @media (min-width: 1024px) { #mampa-grafo .mh-site-title { max-width: 30%; } }
  #mampa-grafo .mh-site-title a { display: block; font-weight: 600; font-size: 1.2rem; line-height: 1.2; }
  #mampa-grafo .mh-site-title img { max-height: 50px; width: auto; height: auto; max-width: 100%; display: block; }
  @media (min-width: 1024px) { #mampa-grafo .mh-site-title img { max-height: 60px; } }

  /* Menú horizontal (escritorio) */
  #mampa-grafo .mh-nav { display: none; }
  @media (min-width: 1024px) { #mampa-grafo .mh-nav { display: block; } }
  #mampa-grafo .mh-nav ul {
    list-style: none; display: flex; margin: 0 -15px 0 0; padding: 0;
  }
  #mampa-grafo .mh-nav ul li { margin: 0; cursor: pointer; }
  #mampa-grafo .mh-nav ul li > a {
    display: block; position: relative; color: var(--primary); text-decoration: none;
    text-transform: uppercase; padding-top: .3rem; padding-bottom: .3rem; margin: 30px 15px;
    font-family: 'Raleway', system-ui, sans-serif; font-size: 1rem; font-weight: 700; line-height: 1.5;
  }
  #mampa-grafo .mh-nav ul li > a::after {
    content: ""; position: absolute; height: 1px; width: 100%; background: var(--primary);
    bottom: 0; left: 0; right: 0; margin: auto; transform: scale(0); transition: all .5s ease;
  }
  #mampa-grafo .mh-nav ul li:hover > a::after { transform: scale(1); }
  #mampa-grafo .mh-nav ul li.active > a { font-weight: 600; }
  #mampa-grafo .mh-nav ul li.active > a::after { transform: scale(1); }

  /* Botón hamburguesa (móvil) */
  #mampa-grafo .mh-toggle {
    width: 35px; height: 28px; position: relative; margin: 20px 0; flex-shrink: 0;
    transform: rotate(0deg); transition: .5s ease-in-out; cursor: pointer;
  }
  @media (min-width: 1024px) { #mampa-grafo .mh-toggle { display: none; } }
  #mampa-grafo .mh-toggle span {
    display: block; position: absolute; height: 4px; width: 100%; background: var(--primary);
    border-radius: 9px; opacity: 1; left: 0; transform: rotate(0deg); transition: .25s ease-in-out;
  }
  #mampa-grafo .mh-toggle span:nth-child(1) { top: 0px;  transform-origin: left center; }
  #mampa-grafo .mh-toggle span:nth-child(2) { top: 11px; transform-origin: left center; }
  #mampa-grafo .mh-toggle span:nth-child(3) { top: 22px; transform-origin: left center; }
  #mampa-grafo .mh-toggle.open span:nth-child(1) { transform: rotate(45deg); top: -1px; left: 5px; }
  #mampa-grafo .mh-toggle.open span:nth-child(2) { width: 0%; opacity: 0; }
  #mampa-grafo .mh-toggle.open span:nth-child(3) { transform: rotate(-45deg); top: 24px; left: 5px; }

  /* Menú desplegable (móvil) */
  #mampa-grafo .mh-drawer {
    position: absolute; left: 0; top: var(--nav-h); width: 100%;
    height: calc(100% - var(--nav-h)); z-index: 250;
    transform: translateX(-100%); transition: all .3s ease-out;
    background-color: #36475a; overflow-x: hidden; overflow-y: auto;
  }
  #mampa-grafo .mh-drawer.toggled { transform: translateX(0); }
  @media (min-width: 1024px) { #mampa-grafo .mh-drawer { transform: translateX(-100%) !important; } }
  #mampa-grafo .mh-drawer ul { list-style: none; margin: 0 0 1rem; padding: 0 0 20px; }
  #mampa-grafo .mh-drawer li { margin: 0; padding-left: 15px; padding-right: 15px; }
  #mampa-grafo .mh-drawer li.active { background-color: var(--primary); }
  #mampa-grafo .mh-drawer li.active > a { font-weight: bold; }
  #mampa-grafo .mh-drawer a {
    display: block; border-bottom: 1px solid #999; color: #eef7fa; padding: 1rem;
    text-align: left; text-decoration: none; font-family: 'Raleway', system-ui, sans-serif; font-size: 1rem;
  }

  /* =========================================================
     GRAFO (debajo del nav)
     ========================================================= */
  #mampa-grafo #graph {
    position: absolute; left: 0; z-index: 1; display: block;
    top: var(--nav-h);
    width: 100%;
    height: calc(100% - var(--nav-h));
  }

  #mampa-grafo #header {
    position: absolute; top: var(--nav-h); left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px;
    background: linear-gradient(180deg, var(--bg) 65%, transparent);
    pointer-events: none; gap: 12px;
  }
  #mampa-grafo #header > * { pointer-events: auto; }

  #mampa-grafo .logo {
    font-family: 'Raleway', sans-serif;
    font-size: 20px; font-weight: 600; letter-spacing: 0.3px;
    color: var(--text); flex-shrink: 0;
  }
  #mampa-grafo .logo span { color: var(--accent-dark); }
  #mampa-grafo .logo .subtitle {
    font-family: 'Raleway', sans-serif;
    font-size: 11px; font-weight: 400; color: var(--text-dim);
    display: block; margin-top: -2px; letter-spacing: 1.5px; text-transform: uppercase;
  }

  #mampa-grafo .header-right { display: flex; align-items: center; gap: 16px; position: relative; }

  #mampa-grafo #search-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 9px 18px; width: 260px;
    color: var(--text); font-family: 'Raleway', sans-serif; font-size: 13px;
    outline: none; transition: border-color 0.3s, box-shadow 0.3s;
  }
  #mampa-grafo #search-box:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,178,227,0.15); }
  #mampa-grafo #search-box::placeholder { color: var(--text-light); }

  #mampa-grafo #controls {
    position: absolute; top: calc(var(--nav-h) + 68px); left: 24px; z-index: 90;
    display: flex; flex-direction: column; gap: 5px; pointer-events: auto;
  }

  #mampa-grafo .filter-btn {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border-light);
    border-radius: 20px; padding: 7px 16px;
    color: var(--text); font-family: 'Raleway', sans-serif; font-size: 11px;
    cursor: pointer; transition: all 0.25s; user-select: none;
    box-shadow: 0 1px 3px rgba(58,52,40,0.06); white-space: nowrap;
  }
  #mampa-grafo .filter-btn:hover { border-color: var(--accent); background: var(--bg-warm); }
  #mampa-grafo .filter-btn.off { opacity: 0.35; }
  #mampa-grafo .filter-btn .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  #mampa-grafo .filter-btn .count {
    font-size: 10px; color: var(--text-light); margin-left: auto; font-variant-numeric: tabular-nums;
  }

  #mampa-grafo #back-btn {
    display: none; align-items: center; gap: 6px;
    background: var(--accent-dark); border: none; border-radius: 20px;
    padding: 8px 18px; color: #f5f2e8; font-family: 'Raleway', sans-serif;
    font-size: 11px; font-weight: 500; cursor: pointer;
    transition: background 0.2s; margin-bottom: 3px;
    box-shadow: 0 2px 6px rgba(74,99,64,0.25); white-space: nowrap;
  }
  #mampa-grafo #back-btn:hover { background: var(--accent); }
  #mampa-grafo #back-btn.visible { display: flex; }

  #mampa-grafo #hops-control {
    display: none; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border-light);
    border-radius: 20px; padding: 6px 14px;
    font-size: 11px; color: var(--text); margin-bottom: 2px;
    box-shadow: 0 1px 3px rgba(58,52,40,0.06);
  }
  #mampa-grafo #hops-control.visible { display: flex; }
  #mampa-grafo #hops-control label { color: var(--text-dim); white-space: nowrap; font-size: 11px; }
  #mampa-grafo .hops-btns { display: flex; gap: 4px; }
  #mampa-grafo .hop-btn {
    width: 26px; height: 26px; border-radius: 50%;
    border: 1px solid var(--border); background: transparent;
    color: var(--text-dim); font-family: 'Raleway', sans-serif;
    font-size: 14px; cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  #mampa-grafo .hop-btn:hover { border-color: var(--accent); }
  #mampa-grafo .hop-btn.active {
    background: var(--accent-dark); border-color: var(--accent-dark); color: #f5f2e8; font-weight: 700;
  }

  #mampa-grafo #legend {
    position: absolute; bottom: 20px; left: 24px; z-index: 80;
    display: flex; gap: 18px; font-size: 10px; color: var(--text-dim);
    font-family: 'Raleway', sans-serif; letter-spacing: 0.3px;
    background: rgba(244,244,244,0.85); padding: 4px 8px; border-radius: 12px;
  }
  #mampa-grafo #legend .leg-item { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  #mampa-grafo #legend .leg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  #mampa-grafo #stats {
    position: absolute; bottom: 20px; right: 24px; z-index: 80;
    font-size: 11px; color: var(--text-light); font-variant-numeric: tabular-nums;
    background: rgba(244,244,244,0.85); padding: 4px 8px; border-radius: 12px;
  }

  #mampa-grafo #detail-panel {
    position: absolute; top: calc(var(--nav-h) + 68px); right: 24px; z-index: 100;
    width: 330px; max-height: calc(100% - var(--nav-h) - 100px);
    background: var(--surface); border: 1px solid var(--border-light);
    border-radius: 12px; padding: 22px;
    display: none; overflow-y: auto;
    box-shadow: 0 4px 20px rgba(58,52,40,0.1);
  }
  #mampa-grafo #detail-panel.visible { display: block; }
  #mampa-grafo #detail-panel .close-btn {
    position: absolute; top: 14px; right: 16px;
    background: none; border: none; color: var(--text-light);
    font-size: 18px; cursor: pointer; line-height: 1;
  }
  #mampa-grafo #detail-panel .close-btn:hover { color: var(--text); }
  #mampa-grafo #detail-panel .node-type-badge {
    display: inline-block; font-size: 9px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1.2px;
    padding: 3px 10px; border-radius: 10px; margin-bottom: 10px;
    font-family: 'Raleway', sans-serif;
  }
  #mampa-grafo #detail-panel h2 {
    font-family: 'Raleway', sans-serif;
    font-size: 17px; font-weight: 600; line-height: 1.4; margin: 0 0 12px; color: var(--text);
  }
  #mampa-grafo #detail-panel .meta-row { font-size: 12px; color: var(--text-dim); margin-bottom: 5px; line-height: 1.5; }
  #mampa-grafo #detail-panel .meta-row strong { color: var(--text); font-weight: 500; }
  #mampa-grafo #detail-panel .abstract {
    font-family: 'Raleway', sans-serif; font-size: 13px; line-height: 1.65; color: var(--text-dim);
    margin: 14px 0; font-style: italic; border-left: 2px solid var(--border); padding-left: 14px;
  }
  #mampa-grafo #detail-panel .link-btn {
    display: inline-block; margin-top: 14px;
    background: var(--accent-dark); color: #f5f2e8; text-decoration: none;
    font-size: 11px; font-weight: 500; padding: 8px 20px;
    border-radius: 20px; transition: background 0.2s; letter-spacing: 0.3px;
  }
  #mampa-grafo #detail-panel .link-btn:hover { background: var(--accent); }
  #mampa-grafo #detail-panel .connections { margin-top: 16px; border-top: 1px solid var(--border-light); padding-top: 14px; }
  #mampa-grafo #detail-panel .connections h3 {
    font-family: 'Raleway', sans-serif; font-size: 10px; text-transform: uppercase;
    letter-spacing: 1.2px; color: var(--text-light); margin: 0 0 8px; font-weight: 500;
  }
  #mampa-grafo #detail-panel .conn-item { font-size: 12px; padding: 3px 0; cursor: pointer; transition: color 0.2s; color: var(--text-dim); }
  #mampa-grafo #detail-panel .conn-item:hover { color: var(--accent-dark); }
  #mampa-grafo #detail-panel .conn-item .conn-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: middle;
  }
  #mampa-grafo #detail-panel::-webkit-scrollbar { width: 4px; }
  #mampa-grafo #detail-panel::-webkit-scrollbar-track { background: transparent; }
  #mampa-grafo #detail-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  #mampa-grafo #search-results {
    position: absolute; top: calc(var(--nav-h) + 54px); right: 28px; z-index: 101;
    width: 260px; background: var(--surface); border: 1px solid var(--border-light);
    border-radius: 0 0 12px 12px; max-height: 240px; overflow-y: auto; display: none;
    box-shadow: 0 4px 16px rgba(58,52,40,0.1);
  }
  #mampa-grafo #search-results.visible { display: block; }
  #mampa-grafo .search-item {
    padding: 8px 18px; font-size: 12px; cursor: pointer;
    border-bottom: 1px solid var(--border-light); transition: background 0.15s; color: var(--text);
  }
  #mampa-grafo .search-item:hover { background: var(--surface2); }
  #mampa-grafo .search-item .si-type {
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.8px; margin-left: 6px; font-weight: 500;
  }

  /* Clase propia (mh-tooltip): evita heredar el `content:"\uf059"` (ícono "?") del .tooltip del tema */
  #mampa-grafo .mh-tooltip {
    position: absolute; padding: 7px 12px; background: var(--surface);
    border: 1px solid var(--border-light); border-radius: 8px;
    font-size: 11px; color: var(--text); pointer-events: none;
    z-index: 200; display: none; max-width: 260px;
    box-shadow: 0 3px 12px rgba(58,52,40,0.12); font-family: 'Raleway', sans-serif;
  }

  /* Íconos por tipo de nodo (emoji) */
  #mampa-grafo .mh-emoji {
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "EmojiOne Color", sans-serif;
    font-style: normal; font-weight: 400; line-height: 1;
  }
  #mampa-grafo #legend .mh-emoji { font-size: 12px; }
  #mampa-grafo .filter-btn .mh-emoji { font-size: 11px; }
  #mampa-grafo #detail-panel .mh-emoji { font-size: 11px; }

  #mampa-grafo #loading {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-family: 'Raleway', sans-serif; font-size: 1.2rem; color: var(--text-dim);
    pointer-events: none; z-index: 5;
  }

  /* =========================================
     RESPONSIVE (móvil y tablet)
     ========================================= */
  @media (max-width: 1023px) {
    #mampa-grafo { --nav-h: 86px; }
  }

  @media (max-width: 768px) {
    #mampa-grafo #header {
      flex-direction: column; align-items: stretch; padding: 10px 14px; gap: 8px;
      background: linear-gradient(180deg, var(--bg) 80%, transparent);

    #mampa-grafo .logo .subtitle { font-size: 9px; letter-spacing: 1px; }

    #mampa-grafo #search-box { width: 100%; padding: 7px 14px; font-size: 12px; }
    #mampa-grafo #search-results { top: calc(var(--nav-h) + 86px); left: 14px; right: 14px; width: auto; }
    #mampa-grafo #controls {
      top: calc(var(--nav-h) + 92px); left: 12px; right: 12px;
      flex-direction: row; flex-wrap: wrap; gap: 6px; align-items: center;
    }
    #mampa-grafo .filter-btn { padding: 4px 10px; font-size: 10px; gap: 5px; }
    #mampa-grafo .filter-btn .dot { width: 7px; height: 7px; }
    #mampa-grafo .filter-btn .count { display: none; }
    #mampa-grafo #back-btn { padding: 5px 12px; font-size: 10px; margin-bottom: 0; }
    #mampa-grafo #hops-control { padding: 3px 8px; font-size: 10px; margin-bottom: 0; }
    #mampa-grafo .hop-btn { width: 22px; height: 22px; font-size: 11px; }
    #mampa-grafo #legend {
      bottom: 28px; left: 10px; right: 10px; gap: 8px; font-size: 9px;
      overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; padding: 4px 6px;
    }
    #mampa-grafo #legend::-webkit-scrollbar { display: none; }
    #mampa-grafo #stats { bottom: 6px; left: 10px; right: auto; font-size: 9px; padding: 2px 6px; }
    #mampa-grafo #detail-panel {
      top: auto; bottom: 0; left: 0; right: 0; width: 100%; max-height: 60%;
      border-radius: 16px 16px 0 0; padding: 16px;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.15); border-bottom: none;
    }
    #mampa-grafo #detail-panel h2 { font-size: 15px; }
    #mampa-grafo #detail-panel .abstract { font-size: 12px; line-height: 1.5; }
  }
</style>

      <li><a href="https://mampa.isep-cba.edu.ar/s/EspacioMAMPA/page/libros">Libros</a></li>
      <li><a href="https://mampa.isep-cba.edu.ar/s/EspacioMAMPA/page/equipo">Equipo</a></li>
      <li><a href="https://mampa.isep-cba.edu.ar/s/EspacioMAMPA/page/contacto">Contacto</a></li>
    </ul>
  </div>

  <div id="header">
    <div class="logo"><span>MAMPA</span> <span class="subtitle">Jard&iacute;n Digital de Contenidos</span></div>
    <div class="header-right"><input id="search-box" placeholder="Buscar en el jardín..." type="text" /></div>
  </div>

  <div id="search-results"></div>

  <div id="controls">
    <button id="back-btn">&larr; Volver al jard&iacute;n</button>
    <div id="hops-control">
      <label>Saltos:</label>
      <div class="hops-btns">
        <button class="hop-btn" data-hops="1">1</button>
        <button class="hop-btn active" data-hops="2">2</button>
        <button class="hop-btn" data-hops="3">3</button>
      </div>
    </div>
  </div>

  <div id="legend">
    <div class="leg-item"><div class="leg-dot" style="background:var(--item)"></div><span class="mh-emoji">📘</span> Fichas</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--creator)"></div><span class="mh-emoji">👤</span> Autores</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--subject)"></div><span class="mh-emoji">🏷️</span> Palabras clave</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--coverage)"></div><span class="mh-emoji">🗂️</span> &Aacute;reas</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--type)"></div><span class="mh-emoji">🧩</span> Tipos</div>
  </div>

  <div id="stats"></div>
  <div id="detail-panel"></div>
  <div class="mh-tooltip" id="tooltip"></div>
  <div id="loading">Cargando jard&iacute;n...</div>
  <svg id="graph"></svg>
</div>

<script>
(function() {

const DATA_URL = 'https://mampa.isep-cba.edu.ar/themes/freedomISEP/asset/js/data/graph.json';

/* ---------- Menú hamburguesa (móvil) + alto real del header ---------- */
(function() {
  const root = document.getElementById('mampa-grafo');
  const hdr = document.getElementById('mampa-header');
  const toggle = document.getElementById('nav-toggle');
  const drawer = document.getElementById('nav-drawer');

  function flip() {
    const open = drawer.classList.toggle('toggled');
    toggle.classList.toggle('open', open);
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  if (toggle && drawer) {
    toggle.addEventListener('click', flip);
    toggle.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }
    });
  }

  // El tema reserva espacio arriba (padding-top del body) para su header. Se mide y se compensa
  // con margen negativo ANTES de revelar el bloque (nace con visibility:hidden), así no se ve el
  // salto. Se omite dentro del editor de Omeka S / panel de administración.
  const inEditor = !!root.closest('[contenteditable="true"]') || /\/admin\//.test(location.pathname);

  let recenter = null;
  window.__mampaRecenter = function(fn) { recenter = fn; };

  function fitTop() {
    if (inEditor) { root.style.visibility = 'visible'; return; }
    // Idempotente: descuenta el margen ya aplicado en vez de volver a 0 (evita un reflow visible).
    const applied = parseFloat(root.style.marginTop) || 0;
    const naturalTop = root.getBoundingClientRect().top + (window.pageYOffset || 0) - applied;
    const want = Math.round(-naturalTop);
    if (want) root.style.marginTop = want + 'px';
    root.style.zIndex = '1100';
    root.style.visibility = 'visible';
  }

  // El header se mide para que el grafo y los paneles queden justo debajo
  let last = 0;
  function setH() {
    fitTop();
    const h = hdr.offsetHeight;
    if (h && h !== last) {
      last = h;
      root.style.setProperty('--nav-h', h + 'px');
      if (typeof recenter === 'function') recenter(); // re-centra el grafo
    }
  }
  setH();
  window.addEventListener('resize', setH);
  window.addEventListener('load', setH);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(setH);
  const logo = hdr.querySelector('img');
  if (logo && !logo.complete) logo.addEventListener('load', setH);
  // El tema reescribe body{padding-top} en runtime: re-medimos cuando cambie.
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(setH);
    try { ro.observe(document.body, { box: 'border-box' }); } catch (e) { ro.observe(document.body); }
  }
  setTimeout(setH, 400); // seguro: corrige si algo se movió tarde
})();

function initGraph(GRAPH_DATA) {
  const typeLabels = {
    authored_by: 'Autores',
    tagged_with: 'Palabras clave',
    belongs_to_area: 'Áreas temáticas',
    is_type: 'Tipo de contenido'
  };
  const typeColors = {
    authored_by: '#5896d1',
    tagged_with: '#5b9d98',
    belongs_to_area: '#994578',
    is_type: '#b7d181'
  };
  const colorMap = { item: '#0080b1', creator: '#00b2e3', subject: '#87c6a1', coverage: '#0080b1', type: '#b7d181' };
  const typeNames = { item: 'Ficha', creator: 'Autor/a', subject: 'Palabra clave', coverage: 'Área', type: 'Tipo' };
  const typeEmoji = { item: '📘', creator: '👤', subject: '🏷️', coverage: '🗂️', type: '🧩' };
  const relEmoji  = { authored_by: '👤', tagged_with: '🏷️', belongs_to_area: '🗂️', is_type: '🧩' };

  const allNodes = GRAPH_DATA.nodes.map(n => ({
    id: n.id, label: n.l, type: n.t, color: colorMap[n.t] || n.c,
    url: n.url || '', abstract: n.abs || '', fullTitle: n.ft || n.l,
    publisher: n.pub || '', issued: n.dt || '',
    educationLevel: n.el || [], degree: n.d || 0
  }));

  const allEdges = GRAPH_DATA.edges.map(e => ({
    source: e.s, target: e.t, relation: e.r
  }));

  const nodeMap = new Map(allNodes.map(n => [n.id, n]));

  function formatDate(raw) {
    if (!raw) return '';
    const m = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[3] + '/' + m[2] + '/' + m[1];
    return raw;
  }

  const activeRelations = new Set(Object.keys(typeLabels));
  let focusedNodeId = null;
  let maxHops = 2;

  const controlsEl = document.getElementById('controls');
  const backBtn = document.getElementById('back-btn');
  const hopsControl = document.getElementById('hops-control');
  const relCounts = {};
  allEdges.forEach(e => { relCounts[e.relation] = (relCounts[e.relation] || 0) + 1; });

  Object.entries(typeLabels).forEach(([rel, label]) => {
    const btn = document.createElement('div');
    btn.className = 'filter-btn';
    btn.dataset.rel = rel;
    btn.innerHTML = '<div class="dot" style="background:' + typeColors[rel] + '"></div>' +
      (relEmoji[rel] ? '<span class="mh-emoji">' + relEmoji[rel] + '</span> ' : '') +
      label + '<span class="count">' + (relCounts[rel] || 0) + '</span>';
    btn.addEventListener('click', () => {
      if (activeRelations.has(rel)) { activeRelations.delete(rel); btn.classList.add('off'); }
      else { activeRelations.add(rel); btn.classList.remove('off'); }
      updateGraph();
    });
    controlsEl.appendChild(btn);
  });

  backBtn.addEventListener('click', () => {
    focusedNodeId = null;
    backBtn.classList.remove('visible');
    hopsControl.classList.remove('visible');
    updateGraph();
    setTimeout(() => {
      svg.transition().duration(600).call(
        zoom.transform,
        d3.zoomIdentity.translate(width/2, height/2).scale(0.7).translate(-width/2, -height/2)
      );
    }, 50);
  });

  document.querySelectorAll('.hop-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      maxHops = parseInt(btn.dataset.hops);
      document.querySelectorAll('.hop-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (focusedNodeId) updateGraph();
    });
  });

  const container = document.getElementById('mampa-grafo');
  const svg = d3.select('#graph');
  // El tamaño del lienzo es el del SVG (pantalla completa menos la barra de navegación)
  let width = svg.node().clientWidth;
  let height = svg.node().clientHeight;
  const g = svg.append('g');
  const edgeG = g.append('g').attr('class', 'edges');
  const nodeG = g.append('g').attr('class', 'nodes');
  const highlightG = g.append('g').attr('class', 'highlight');

  const defs = svg.append('defs');
  const glow = defs.append('filter').attr('id', 'glow').attr('x', '-50%').attr('y', '-50%').attr('width', '200%').attr('height', '200%');
  glow.append('feGaussianBlur').attr('stdDeviation', '4').attr('result', 'blur');
  glow.append('feComposite').attr('in', 'SourceGraphic').attr('in2', 'blur').attr('operator', 'over');

  // En pantalla completa no hay scroll de página que proteger: el zoom va con la rueda directamente.
  const zoom = d3.zoom()
    .scaleExtent([0.05, 8])
    .wheelDelta(event => -event.deltaY * (event.deltaMode === 1 ? 0.05 : event.deltaMode ? 1 : 0.002))
    .on('zoom', (e) => g.attr('transform', e.transform));
  svg.call(zoom);

  const simulation = d3.forceSimulation()
    .force('link', d3.forceLink().id(d => d.id).distance(d => {
      const st = nodeMap.get(typeof d.source === 'string' ? d.source : d.source.id);
      const tt = nodeMap.get(typeof d.target === 'string' ? d.target : d.target.id);
      if (st && st.type === 'coverage' || tt && tt.type === 'coverage') return 120;
      if (st && st.type === 'type' || tt && tt.type === 'type') return 150;
      return 60;
    }))
    .force('charge', d3.forceManyBody().strength(d => d.type === 'item' ? -15 : -60))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide().radius(d => getRadius(d) + 2))
    .alphaDecay(0.02);

  function getRadius(d) {
    if (focusedNodeId && nodeDepth) {
      const depth = nodeDepth.get(d.id) || maxHops;
      const t = maxHops > 0 ? depth / maxHops : 0;
      if (d.type === 'item') return Math.round(10 - 7 * t);
      const base = Math.sqrt(d.degree || 1);
      return Math.max(5, Math.round((14 - 9 * t) + base * (3 - 1.5 * t)));
    }
    if (d.type === 'item') return 3;
    if (d.type === 'coverage') return Math.max(8, Math.sqrt(d.degree) * 2.5);
    if (d.type === 'type') return Math.max(10, Math.sqrt(d.degree) * 2);
    return Math.max(4, Math.sqrt(d.degree) * 1.5);
  }

  function getNodeOpacity(d) {
    return d.type === 'item' ? 0.6 : 0.9;
  }

  let linkEls, nodeEls, labelEls;
  let currentNodes = [], currentEdges = [];
  let nodeDepth = null;

  function getEdgeId(e) {
    const sid = typeof e.source === 'string' ? e.source : e.source.id;
    const tid = typeof e.target === 'string' ? e.target : e.target.id;
    return sid + '|' + tid + '|' + e.relation;
  }

  function updateGraph() {
    let filteredEdges = allEdges.filter(e => activeRelations.has(e.relation));

    if (focusedNodeId) {
      const adj = new Map();
      filteredEdges.forEach(e => {
        const sid = typeof e.source === 'string' ? e.source : e.source.id;
        const tid = typeof e.target === 'string' ? e.target : e.target.id;
        if (!adj.has(sid)) adj.set(sid, new Set());
        if (!adj.has(tid)) adj.set(tid, new Set());
        adj.get(sid).add(tid);
        adj.get(tid).add(sid);
      });

      nodeDepth = new Map();
      nodeDepth.set(focusedNodeId, 0);
      let frontier = new Set([focusedNodeId]);
      for (let hop = 1; hop <= maxHops; hop++) {
        const nextFrontier = new Set();
        frontier.forEach(id => {
          (adj.get(id) || new Set()).forEach(nbr => {
            if (!nodeDepth.has(nbr)) {
              nodeDepth.set(nbr, hop);
              nextFrontier.add(nbr);
            }
          });
        });
        frontier = nextFrontier;
      }

      const neighborIds = new Set(nodeDepth.keys());
      currentEdges = filteredEdges.filter(e => {
        const sid = typeof e.source === 'string' ? e.source : e.source.id;
        const tid = typeof e.target === 'string' ? e.target : e.target.id;
        return neighborIds.has(sid) && neighborIds.has(tid);
      });
      currentNodes = allNodes.filter(n => neighborIds.has(n.id));
    } else {
      nodeDepth = null;
      currentEdges = filteredEdges;
      const connectedIds = new Set();
      currentEdges.forEach(e => {
        connectedIds.add(typeof e.source === 'string' ? e.source : e.source.id);
        connectedIds.add(typeof e.target === 'string' ? e.target : e.target.id);
      });
      currentNodes = allNodes.filter(n => connectedIds.has(n.id));
    }

    if (focusedNodeId) {
      const n = currentNodes.length;
      const chargeStr = n < 30 ? -300 : n < 80 ? -200 : -140;
      simulation
        .force('charge', d3.forceManyBody().strength(chargeStr))
        .force('collision', d3.forceCollide().radius(d => getRadius(d) + 8))
        .force('link', d3.forceLink().id(d => d.id).distance(d => {
          const sid = typeof d.source === 'string' ? d.source : d.source.id;
          const tid = typeof d.target === 'string' ? d.target : d.target.id;
          const minD = Math.min(nodeDepth.get(sid) || maxHops, nodeDepth.get(tid) || maxHops);
          return 100 + (minD / maxHops) * 60;
        }));
    } else {
      simulation
        .force('charge', d3.forceManyBody().strength(d => d.type === 'item' ? -15 : -60))
        .force('collision', d3.forceCollide().radius(d => getRadius(d) + 2))
        .force('link', d3.forceLink().id(d => d.id).distance(d => {
          const st = nodeMap.get(typeof d.source === 'string' ? d.source : d.source.id);
          const tt = nodeMap.get(typeof d.target === 'string' ? d.target : d.target.id);
          if (st && st.type === 'coverage' || tt && tt.type === 'coverage') return 120;
          if (st && st.type === 'type' || tt && tt.type === 'type') return 150;
          return 60;
        }));
    }

    const edgeColor = '#8a9e78';
    linkEls = edgeG.selectAll('line').data(currentEdges, getEdgeId);
    linkEls.exit().transition().duration(300).attr('stroke-opacity', 0).remove();
    linkEls = linkEls.enter().append('line')
      .attr('stroke', edgeColor)
      .attr('stroke-opacity', 0)
      .attr('stroke-width', focusedNodeId ? 1 : 0.5)
      .merge(linkEls);
    linkEls.transition().duration(400)
      .attr('stroke', edgeColor)
      .attr('stroke-opacity', d => {
        if (!focusedNodeId || !nodeDepth) return 0.18;
        const sid = typeof d.source === 'string' ? d.source : d.source.id;
        const tid = typeof d.target === 'string' ? d.target : d.target.id;
        const minDepth = Math.min(nodeDepth.get(sid) || maxHops, nodeDepth.get(tid) || maxHops);
        return 0.4 - (minDepth / maxHops) * 0.25;
      })
      .attr('stroke-width', d => {
        if (!focusedNodeId || !nodeDepth) return 0.5;
        const sid = typeof d.source === 'string' ? d.source : d.source.id;
        const tid = typeof d.target === 'string' ? d.target : d.target.id;
        const minDepth = Math.min(nodeDepth.get(sid) || maxHops, nodeDepth.get(tid) || maxHops);
        return 1.2 - (minDepth / maxHops) * 0.6;
      });

    nodeEls = nodeG.selectAll('circle').data(currentNodes, d => d.id);
    nodeEls.exit().transition().duration(300).attr('r', 0).remove();
    const entered = nodeEls.enter().append('circle')
      .attr('r', 0)
      .attr('fill', d => d.color)
      .attr('stroke', 'none')
      .attr('cursor', 'pointer')
      .on('mouseover', onHover)
      .on('mouseout', onHoverOut)
      .on('click', onClick)
      .call(d3.drag()
        .on('start', dragStart)
        .on('drag', dragging)
        .on('end', dragEnd));
    nodeEls = entered.merge(nodeEls);
    nodeEls.transition().duration(400)
      .attr('r', d => getRadius(d))
      .attr('fill', d => d.color)
      .attr('opacity', d => getNodeOpacity(d));

    const labelThreshold = focusedNodeId ? 0 : 10;
    const labelNodes = currentNodes.filter(n =>
      (n.id === focusedNodeId) || (n.type !== 'item' && (focusedNodeId ? true : n.degree >= labelThreshold))
    );
    labelEls = nodeG.selectAll('text').data(labelNodes, d => d.id);
    labelEls.exit().transition().duration(200).attr('fill-opacity', 0).remove();
    labelEls = labelEls.enter().append('text')
      .attr('font-size', d => focusedNodeId ? 11 : (d.type === 'coverage' ? 11 : 9))
      .attr('fill', d => d.id === focusedNodeId ? '#3a3428' : d.color)
      .attr('fill-opacity', 0)
      .attr('text-anchor', 'middle')
      .attr('dy', d => -getRadius(d) - 5)
      .attr('font-family', "'Raleway', sans-serif")
      .attr('font-weight', d => d.id === focusedNodeId ? 700 : 400)
      .attr('font-style', d => d.id === focusedNodeId ? 'normal' : 'italic')
      .attr('pointer-events', 'none')
      .text(d => {
        const max = d.id === focusedNodeId ? 50 : 30;
        const t = d.label.length > max ? d.label.slice(0, max - 3) + '...' : d.label;
        return (typeEmoji[d.type] ? typeEmoji[d.type] + ' ' : '') + t;
      })
      .merge(labelEls);
    labelEls.transition().duration(400)
      .attr('fill', d => d.id === focusedNodeId ? '#3a3428' : d.color)
      .attr('font-weight', d => d.id === focusedNodeId ? 700 : 400)
      .attr('fill-opacity', d => d.id === focusedNodeId ? 1 : 0.9)
      .attr('font-size', d => {
        if (!focusedNodeId || !nodeDepth) return d.type === 'coverage' ? 11 : 9;
        const depth = nodeDepth.get(d.id) || maxHops;
        return Math.round(13 - (depth / maxHops) * 4);
      })
      .attr('dy', d => -getRadius(d) - 5);

    highlightG.selectAll('*').remove();
    if (focusedNodeId) {
      const fn = currentNodes.find(n => n.id === focusedNodeId);
      if (fn) {
        const r = getRadius(fn);
        const outer = highlightG.append('circle')
          .attr('r', r + 12)
          .attr('fill', 'none')
          .attr('stroke', fn.color)
          .attr('stroke-width', 1.5);
        outer.append('animate')
          .attr('attributeName', 'stroke-opacity')
          .attr('values', '0.6;0.1;0.6')
          .attr('dur', '2s')
          .attr('repeatCount', 'indefinite');
        outer.append('animate')
          .attr('attributeName', 'r')
          .attr('values', (r + 8) + ';' + (r + 20) + ';' + (r + 8))
          .attr('dur', '2s')
          .attr('repeatCount', 'indefinite');
        highlightG.append('circle')
          .attr('r', r + 4)
          .attr('fill', 'none')
          .attr('stroke', fn.color)
          .attr('stroke-width', 2)
          .attr('stroke-opacity', 0.6)
          .attr('filter', 'url(#glow)');
      }
    }

    simulation.nodes(currentNodes);
    simulation.force('link').links(currentEdges);
    simulation.force('center', d3.forceCenter(width / 2, height / 2));
    simulation.alpha(0.8).restart();

    const label = focusedNodeId ? ' (vecindario ' + maxHops + (maxHops === 1 ? ' salto' : ' saltos') + ')' : '';
    document.getElementById('stats').textContent =
      currentNodes.length + ' nodos · ' + currentEdges.length + ' aristas' + label;
  }

  simulation.on('tick', () => {
    if (linkEls) linkEls
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    if (nodeEls) nodeEls
      .attr('cx', d => d.x).attr('cy', d => d.y);
    if (labelEls) labelEls
      .attr('x', d => d.x).attr('y', d => d.y);
    if (focusedNodeId) {
      const fn = currentNodes.find(n => n.id === focusedNodeId);
      if (fn) highlightG.selectAll('circle').attr('cx', fn.x).attr('cy', fn.y);
    }
  });

  function focusOnNode(d) {
    focusedNodeId = d.id;
    backBtn.classList.add('visible');
    hopsControl.classList.add('visible');
    updateGraph();
    showDetail(d);
  }

  const tooltip = document.getElementById('tooltip');

  function onHover(e, d) {
    const rect = container.getBoundingClientRect();
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX - rect.left + 12) + 'px';
    tooltip.style.top = (e.clientY - rect.top - 10) + 'px';
    const extra = d.type === 'item' ? '' : ' (' + d.degree + ' fichas)';
    tooltip.textContent = (typeEmoji[d.type] ? typeEmoji[d.type] + ' ' : '') + d.label + extra;

    if (focusedNodeId) return;

    const connSet = new Set();
    currentEdges.forEach(edge => {
      const sid = typeof edge.source === 'string' ? edge.source : edge.source.id;
      const tid = typeof edge.target === 'string' ? edge.target : edge.target.id;
      if (sid === d.id) connSet.add(tid);
      if (tid === d.id) connSet.add(sid);
    });
    connSet.add(d.id);
    nodeEls.attr('opacity', n => connSet.has(n.id) ? 1 : 0.06);
    linkEls.attr('stroke-opacity', edge => {
      const sid = typeof edge.source === 'string' ? edge.source : edge.source.id;
      const tid = typeof edge.target === 'string' ? edge.target : edge.target.id;
      return (sid === d.id || tid === d.id) ? 0.5 : 0.02;
    });
    if (labelEls) labelEls.attr('fill-opacity', n => connSet.has(n.id) ? 1 : 0.05);
  }

  function onHoverOut() {
    tooltip.style.display = 'none';
    if (focusedNodeId) return;
    nodeEls.attr('opacity', d => d.type === 'item' ? 0.6 : 0.9);
    linkEls.attr('stroke-opacity', 0.18);
    if (labelEls) labelEls.attr('fill-opacity', 0.9);
  }

  function onClick(e, d) { e.stopPropagation(); focusOnNode(d); }

  function showDetail(d) {
    const panel = document.getElementById('detail-panel');
    panel.classList.add('visible');

    let html = '<button class="close-btn">&times;</button>';
    html += '<div class="node-type-badge" style="background:' + colorMap[d.type] + '18;color:' + colorMap[d.type] + '">' +
      (typeEmoji[d.type] ? '<span class="mh-emoji">' + typeEmoji[d.type] + '</span> ' : '') +
      typeNames[d.type] + '</div>';
    html += '<h2>' + (d.fullTitle || d.label) + '</h2>';

    if (d.type === 'item') {
      if (d.publisher) html += '<div class="meta-row"><strong>Editor:</strong> ' + d.publisher + '</div>';
      if (d.issued) html += '<div class="meta-row"><strong>Fecha:</strong> ' + formatDate(d.issued) + '</div>';
      if (d.educationLevel && d.educationLevel.length)
        html += '<div class="meta-row"><strong>Nivel:</strong> ' + d.educationLevel.join(', ') + '</div>';
      if (d.abstract) html += '<div class="abstract">' + d.abstract + '</div>';
      if (d.url) html += '<a class="link-btn" href="' + d.url + '" target="_blank" rel="noopener">Ver en MAMPA ↗</a>';
    } else {
      html += '<div class="meta-row"><strong>Conexiones:</strong> ' + d.degree + ' fichas</div>';
    }

    const connections = [];
    currentEdges.forEach(edge => {
      const sid = typeof edge.source === 'string' ? edge.source : edge.source.id;
      const tid = typeof edge.target === 'string' ? edge.target : edge.target.id;
      if (sid === d.id) connections.push({ node: nodeMap.get(tid), rel: edge.relation });
      if (tid === d.id) connections.push({ node: nodeMap.get(sid), rel: edge.relation });
    });

    if (connections.length > 0) {
      html += '<div class="connections"><h3>Conexiones (' + connections.length + ')</h3>';
      connections.sort((a, b) => (a.node.type > b.node.type ? 1 : -1));
      connections.slice(0, 40).forEach(c => {
        html += '<div class="conn-item" data-id="' + c.node.id + '"><span class="conn-dot" style="background:' + c.node.color + '"></span>' + c.node.label + '</div>';
      });
      if (connections.length > 40) html += '<div class="meta-row">... y ' + (connections.length - 40) + ' más</div>';
      html += '</div>';
    }

    panel.innerHTML = html;
    panel.querySelector('.close-btn').addEventListener('click', () => panel.classList.remove('visible'));
    panel.querySelectorAll('.conn-item').forEach(el => {
      el.addEventListener('click', () => {
        const n = nodeMap.get(el.dataset.id);
        if (n) focusOnNode(n);
      });
    });
  }

  function dragStart(e, d) { if (!e.active) simulation.alphaTarget(0.1).restart(); d.fx = d.x; d.fy = d.y; }
  function dragging(e, d) { d.fx = e.x; d.fy = e.y; }
  function dragEnd(e, d) { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }

  const searchBox = document.getElementById('search-box');
  const searchResults = document.getElementById('search-results');

  searchBox.addEventListener('input', () => {
    const q = searchBox.value.toLowerCase().trim();
    if (q.length < 2) { searchResults.classList.remove('visible'); return; }
    const matches = allNodes.filter(n => n.label.toLowerCase().includes(q)).slice(0, 12);
    if (matches.length === 0) { searchResults.classList.remove('visible'); return; }
    searchResults.innerHTML = matches.map(n => {
      return '<div class="search-item" data-id="' + n.id + '">' + n.label + '<span class="si-type" style="color:' + n.color + '">' + (typeEmoji[n.type] ? typeEmoji[n.type] + ' ' : '') + typeNames[n.type] + '</span></div>';
    }).join('');
    searchResults.classList.add('visible');
    searchResults.querySelectorAll('.search-item').forEach(el => {
      el.addEventListener('click', () => {
        const n = nodeMap.get(el.dataset.id);
        if (n) focusOnNode(n);
        searchResults.classList.remove('visible');
        searchBox.value = '';
      });
    });
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('#search-results') && !e.target.closest('#search-box'))
      searchResults.classList.remove('visible');
  });

  svg.on('click', () => {
    document.getElementById('detail-panel').classList.remove('visible');
  });

  // Mantener el grafo centrado si cambia el tamaño de la ventana / rota el celular
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      width = svg.node().clientWidth;
      height = svg.node().clientHeight;
      simulation.force('center', d3.forceCenter(width / 2, height / 2));
      simulation.alpha(0.3).restart();
    }, 150);
  });

  // Hook para re-centrar cuando el ajuste del header cambia la altura útil (sin emitir resize global)
  if (window.__mampaRecenter) window.__mampaRecenter(function() {
    width = svg.node().clientWidth;
    height = svg.node().clientHeight;
    simulation.force('center', d3.forceCenter(width / 2, height / 2));
    simulation.alpha(0.3).restart();
  });

  updateGraph();
  setTimeout(() => {
    svg.transition().duration(800).call(
      zoom.transform,
      d3.zoomIdentity.translate(width/2, height/2).scale(0.7).translate(-width/2, -height/2)
    );
  }, 100);

}

fetch(DATA_URL)
  .then(r => r.json())
  .then(data => {
    const el = document.getElementById('loading');
    if (el) el.remove();
    initGraph(data);
  })
  .catch(err => {
    const el = document.getElementById('loading');
    if (el) el.textContent = 'Error al cargar datos: ' + err.message;
  });

})();
</script>
